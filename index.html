<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4d3a">
<title>Geography in the News | CBA 1 Topic Picker</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#1d2a24; --muted:#5d6b63;
  --green:#1f4d3a; --green2:#2f7556; --clay:#c8553d; --sand:#e8dcc3; --sky:#2b6f8f;
  --line:#ddd2b8; --radius:16px; --hi:#e3f1e8;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14201a;--card:#1b2b23;--ink:#eef2ea;--muted:#a6b5ab;--green:#7fd1a5;--green2:#58b88a;--clay:#f08a72;--sand:#27392f;--sky:#7cc1de;--line:#2f4439;--hi:#21402f}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Iowan Old Style","Palatino Linotype",serif;min-height:100vh}
h1,h2,h3,.ui{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--green);color:#f6f1e7;padding:20px 16px 18px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
@media (prefers-color-scheme:dark){header{background:#0f3022;color:#eef2ea}}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
header h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
header p{margin:4px 0 0;opacity:.85;font-size:.95rem}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:.8rem}
.crumbs span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.crumbs span.on{background:#f6f1e7;color:#1f4d3a;font-weight:700}
main{padding:20px 0 60px}
h2{font-size:1.25rem;margin:6px 0 14px;letter-spacing:-.01em}
.grid{display:grid;gap:12px}
button.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;transition:transform .12s,border-color .12s}
button.card:active{transform:scale(.985)}
button.card:hover,button.card:focus-visible{border-color:var(--green2)}
button.card:focus-visible,.back:focus-visible,.chk:focus-within,.btn:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.tag{display:inline-block;font:700 .72rem/1 "Avenir Next","Segoe UI",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);margin-bottom:6px}
.card h3{margin:0 0 4px;font-size:1.12rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.topic{display:flex;gap:14px;align-items:flex-start}
.badge{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sand);display:grid;place-items:center;font:700 1.05rem "Avenir Next",system-ui,sans-serif;color:var(--green)}
.back{all:unset;cursor:pointer;color:var(--sky);font:600 .92rem "Avenir Next","Segoe UI",system-ui,sans-serif;margin-bottom:10px;display:inline-block;padding:6px 0}
.lead{color:var(--muted);margin:0 0 16px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:1.02rem}
.panel p{margin:0 0 10px}
.panel p:last-child{margin-bottom:0}
.wh,.plain{list-style:none;margin:0;padding:0}
.wh li{display:flex;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.wh li:first-child{border-top:0;padding-top:0}
.wh b{flex:none;width:58px;font:800 .78rem/1.7 "Avenir Next",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--clay)}
.plain li{padding:9px 0 9px 22px;border-top:1px dashed var(--line);position:relative}
.plain li:first-child{border-top:0}
.plain li:before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--green2)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{flex:none;width:22px;height:22px;margin-top:2px;accent-color:var(--green2)}
.chk input:checked+span{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;width:0;background:var(--green2);transition:width .25s}
.links a{display:block;padding:12px 0;border-top:1px dashed var(--line);color:var(--sky);font:600 .98rem "Avenir Next","Segoe UI",system-ui,sans-serif;text-decoration:none}
.links a:first-of-type{border-top:0}
.links a small{display:block;color:var(--muted);font-weight:400;font-size:.84rem}
.note{font-size:.84rem;color:var(--muted);margin-top:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:11px 16px;border-radius:12px;background:var(--green);color:#f6f1e7;font:700 .9rem "Avenir Next",system-ui,sans-serif}
.btn.alt{background:transparent;color:var(--green);border:1.5px solid var(--green)}
@media (prefers-color-scheme:dark){.btn{color:#0f3022}}
.weeks{display:grid;gap:10px}
.week{display:flex;gap:12px}
.week i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green2);color:#fff;font:700 .9rem "Avenir Next",system-ui,sans-serif;font-style:normal;display:grid;place-items:center}
.week div b{display:block;font:700 .95rem "Avenir Next",system-ui,sans-serif}
.week div span{color:var(--muted);font-size:.93rem}
details{border-top:1px dashed var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font:700 .95rem "Avenir Next",system-ui,sans-serif;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--clay);font-size:1.2rem;line-height:1}
details[open] summary:after{content:"–"}
details p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.pill{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border-radius:99px;background:var(--sand);font:600 .8rem "Avenir Next",system-ui,sans-serif}
.pill.top{background:var(--clay);color:#fff}
/* story cards */
.story{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
.story.on{border-color:var(--green2);background:var(--hi)}
.story .meta{font:600 .78rem "Avenir Next",system-ui,sans-serif;color:var(--muted);margin-bottom:6px}
.story a.h{display:block;font:700 1.02rem/1.35 "Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--sky);text-decoration:none;margin:2px 0 6px}
.story a.h:hover{text-decoration:underline}
.story p{margin:0 0 10px;color:var(--ink);font-size:.95rem}
.story .why b{font:700 .72rem "Avenir Next",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--clay)}
.warn{font-size:.82rem;color:var(--muted);margin:-4px 0 10px;font-style:italic}
.fresh{font-size:.82rem;color:var(--muted);margin:0 0 12px}
button.pick{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;transition:border-color .12s}
button.pick:hover,button.pick:focus-visible{border-color:var(--green2)}
button.pick:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.pick b{display:block;font:700 1rem/1.35 "Avenir Next",system-ui,sans-serif;margin-bottom:4px}
button.pick small{color:var(--muted);font:600 .8rem "Avenir Next",system-ui,sans-serif}
.jl{display:block;margin-bottom:12px}
.jl b{display:block;font:700 .95rem "Avenir Next",system-ui,sans-serif}
.jl small{display:block;color:var(--muted);font:.85rem/1.4 "Avenir Next",system-ui,sans-serif;margin:2px 0 6px}
.jl textarea{box-sizing:border-box;width:100%;min-height:76px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:inherit;font:1rem/1.45 Georgia,serif;resize:vertical}
.jl textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media print{header,.back,.actions,.crumbs,.pick,.choose{display:none}body{background:#fff;color:#000}.panel{break-inside:avoid}details{display:block}details p{display:block}}
</style>
</head>

var app=document.getElementById("app");
var crumbs=document.getElementById("crumbs");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||"null")}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function setCrumbs(step){
  crumbs.innerHTML=["1 · Topic","2 · Brief"].map(function(n,i){return '<span class="'+(i===step?'on':'')+'">'+n+'</span>'}).join("");
}
function list(arr){return '<ul class="plain">'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'}

/* ---------- VIEWS ---------- */
function home(){
  setCrumbs(0);
  document.title="Geography in the News | CBA 1 Topic Picker";
  var h='<section class="panel"><span class="tag">CBA 1 · 2nd year</span><h3>What you will do</h3>'+
    '<p>Pick a recent geographical event from the media, at a local, national or global scale. Over about three weeks you will investigate it, look beyond your first source, and present your response in a format you choose with your teacher.</p>'+
    '<p>Your response needs to show the <b>processes, patterns and systems</b> behind the event, the <b>geographical skills</b> you used, and the <b>sustainability</b> side of the story.</p></section>';

  var feats=[];
  TOPICS.forEach(function(t){t.stories.forEach(function(s){if(s.feat){feats.push([t,s])}})});
  if(feats.length){
    h+='<h2>Top picks</h2><p class="fresh">Tap one to open its brief.</p><div class="grid" style="margin-bottom:22px">';
    feats.forEach(function(f){
      h+='<button class="pick" data-go="#/'+f[0].id+'"><b>'+esc(f[1].h)+'</b><small>'+esc(f[1].src)+' · '+esc(f[1].d)+' · '+esc(f[0].name)+'</small></button>';
    });
    h+='</div>';
  }

  h+='<h2>Or choose an area to explore</h2><div class="grid">';
  TOPICS.forEach(function(t){
    h+='<button class="card topic" data-go="#/'+t.id+'"><span class="badge" aria-hidden="true">'+esc(t.name.charAt(0))+'</span><span><h3>'+esc(t.name)+'</h3><p>'+esc(t.blurb)+'</p></span></button>';
  });
  h+='</div><p class="note">The stories are suggestions. Your actual story must be agreed with your teacher.</p>';
  app.innerHTML=h;
}

function brief(id){
  var t=TOPICS.filter(function(x){return x.id===id})[0];
  if(!t){return home()}
  setCrumbs(1);
  document.title=t.name+" | CBA 1";
  var key="cba1:"+id;
  var skey="cba1:story:"+id;
  var nkey="cba1:notes:"+id;
  var saved=store(key)||[];
  var chosen=store(skey);
  var order=[["who","Who"],["what","What"],["where","Where"],["when","When"],["how","How"],["why","Why"]];

  var h='<button class="back" data-go="#/">‹ All areas</button><span class="tag">CBA 1 · Geography in the News</span><h2>'+esc(t.name)+'</h2><p class="lead">'+esc(t.blurb)+'</p>';

  h+='<section class="panel"><h3>Step 1: choose your story</h3>';
  if(t.stories.length){
    h+='<p class="fresh">Recent stories. Open the link, read it, then tap <b>Choose this story</b> on the one you like. Agree it with your teacher.</p>';
    t.stories.forEach(function(s,i){
      h+='<div class="story'+(chosen===i?' on':'')+'" data-s="'+i+'"><div class="meta">';
      if(s.top){h+='<span class="pill top">Top pick</span>'}
      h+='<span class="pill">'+esc(s.sc)+'</span>'+esc(s.src)+' · '+esc(s.d)+'</div>'+
        '<a class="h" href="'+esc(s.u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.h)+' ↗</a>'+
        '<p class="why"><b>Why it works</b><br>'+esc(s.why)+'</p>'+
        '<button class="btn alt choose" data-i="'+i+'">'+(chosen===i?'✓ My story':'Choose this story')+'</button></div>';
    });
    if(t.note){h+='<p class="note">'+esc(t.note)+'</p>'}
    h+='<p><b>Want a different story?</b> Check it first:</p>';
  }else{
    h+='<p>Find your own recent story in the news, then check it:</p>';
  }
  h+=list(OWN_CHECKS)+'</section>';

  if(t.old&&t.old.length){
    h+='<section class="panel"><h3>Bigger events from earlier years</h3><p class="warn">These are major events from 2000 onwards. Your teacher must agree with you that an older event can be used, and agree the dates you will cover, before you start.</p>';
    t.old.forEach(function(s){
      h+='<div class="story"><div class="meta"><span class="pill">'+esc(s.sc)+'</span>'+esc(s.src)+' · '+esc(s.d)+'</div>'+
        '<a class="h" href="'+esc(s.u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.h)+' ↗</a>'+
        '<p class="why"><b>Why it matters</b><br>'+esc(s.why)+'</p></div>';
    });
    h+='<p class="note">An overview page is a starting point only. Find news reports on the event as well.</p></section>';
  }

  h+='<section class="panel"><h3>Step 2: the six key questions</h3><ul class="wh">';
  order.forEach(function(o){h+='<li><b>'+o[1]+'</b><span>'+esc(t.q[o[0]])+'</span></li>'});
  h+='</ul></section>';

  h+='<section class="panel"><h3>Step 3: go deeper</h3>'+
    '<p><b>Scale.</b> '+esc(t.scale)+'</p>'+
    '<p><b>Sustainability.</b> '+esc(t.sus)+'</p>'+
    '<p><b>Think about:</b></p>'+list(THINK)+'</section>';

  var notes=store(nkey)||{};
  var jr=order.concat([["conc","My conclusion"]]);
  h+='<section class="panel" id="journal"><h3>My CBA journal</h3><p>Write your notes here as you go. They save on this device. Use <b>Copy my notes</b> to paste them into your own document.</p>';
  jr.forEach(function(o){
    var prompt=o[0]==="conc"?"What did you find out, and why does it matter geographically?":t.q[o[0]];
    h+='<label class="jl"><b>'+o[1]+'</b><small>'+esc(prompt)+'</small><textarea data-k="'+o[0]+'" rows="3">'+esc(notes[o[0]]||"")+'</textarea></label>';
  });
  h+='<div class="actions"><button class="btn alt" id="copyn">Copy my notes</button><span id="copied" class="ui" style="font-size:.85rem;color:var(--muted)" aria-live="polite"></span></div></section>';

  h+='<section class="panel"><h3>Suggested three weeks</h3><div class="weeks">'+
    '<div class="week"><i>1</i><div><b>Choose and start</b><span>Agree your story, answer the six questions, name the process, pattern or system.</span></div></div>'+
    '<div class="week"><i>2</i><div><b>Widen and analyse</b><span>Use more sources and viewpoints, check reliability, find maps and data, form conclusions.</span></div></div>'+
    '<div class="week"><i>3</i><div><b>Create and present</b><span>Build your response, check it against the quality levels, add your sources.</span></div></div>'+
    '</div><p class="note" style="margin-top:12px">This is a suggested plan only. Your teacher will set your actual timetable.</p></section>';

  h+='<section class="panel"><h3>Ways to present</h3><p>You can work alone, in a pair or in a group. Agree the format with your teacher:</p><div>'+
    FORMATS.map(function(f){return '<span class="pill">'+esc(f)+'</span>'}).join("")+'</div></section>';

  h+='<section class="panel"><h3>My checklist</h3><div class="bar" aria-hidden="true"><i id="bar"></i></div><div id="prog" class="ui" style="font-size:.85rem;color:var(--muted);margin:-4px 0 8px"></div>';
  CHECKLIST.forEach(function(it,i){
    h+='<label class="chk"><input type="checkbox" data-i="'+i+'"'+(saved.indexOf(i)>-1?' checked':'')+'><span>'+esc(it)+'</span></label>';
  });
  h+='<div class="actions" style="margin-top:14px"><button class="btn alt" id="reset">Clear ticks</button><button class="btn" id="print">Print or save</button></div></section>';

  h+='<section class="panel"><h3>How your work will be judged</h3><p>Your teacher picks the level that best fits your work overall. Tap a level to read what it looks like.</p>';
  LEVELS.forEach(function(l,i){h+='<details'+(i===2?' open':'')+'><summary>'+esc(l[0])+'</summary><p>'+esc(l[1])+'</p></details>'});
  h+='<p class="note">This is a student-friendly summary. The official Features of Quality are in the NCCA guidelines on curriculumonline.ie.</p></section>';

  h+='<section class="panel links"><h3>Places to start looking</h3>';
  t.links.forEach(function(l){
    h+='<a href="'+esc(l[1])+'" target="_blank" rel="noopener noreferrer">'+esc(l[0])+' ↗<small>'+esc(l[2])+'</small></a>';
  });
  h+='<a href="https://curriculumonline.ie/Junior-cycle/Junior-Cycle-Subjects/Geography" target="_blank" rel="noopener noreferrer">Official Geography CBA guidelines ↗<small>Curriculum Online</small></a></section>';
  h+='<p class="note">Your ticks and chosen story are saved on this device only. Some news sites limit free articles. Always say exactly which pages you used and check facts in more than one source.</p>';
  app.innerHTML=h;

  var boxes=app.querySelectorAll('.chk input');
  function update(){
    var on=[];boxes.forEach(function(b){if(b.checked)on.push(+b.dataset.i)});
    store(key,on);
    document.getElementById("bar").style.width=(on.length/CHECKLIST.length*100)+"%";
    document.getElementById("prog").textContent=on.length+" of "+CHECKLIST.length+" done";
  }
  boxes.forEach(function(b){b.addEventListener("change",update)});
  document.getElementById("reset").addEventListener("click",function(){boxes.forEach(function(b){b.checked=false});update()});
  document.getElementById("print").addEventListener("click",function(){window.print()});

  app.querySelectorAll('.choose').forEach(function(btn){
    btn.addEventListener("click",function(){
      var i=+btn.dataset.i;
      var now=store(skey);
      var next=(now===i)?null:i;
      store(skey,next);
      app.querySelectorAll('.story').forEach(function(card){
        var idx=+card.dataset.s;
        card.classList.toggle("on",idx===next);
        card.querySelector('.choose').textContent=(idx===next)?'✓ My story':'Choose this story';
      });
    });
  });
  var tas=app.querySelectorAll('#journal textarea');
  tas.forEach(function(ta){
    ta.addEventListener("input",function(){
      var o={};tas.forEach(function(x){o[x.dataset.k]=x.value});
      store(nkey,o);
    });
  });
  document.getElementById("copyn").addEventListener("click",function(){
    var lines=["CBA 1: "+t.name];
    var c=store(skey);
    if(typeof c==="number"&&t.stories[c]){lines.push("My story: "+t.stories[c].h+" ("+t.stories[c].src+", "+t.stories[c].d+")\n"+t.stories[c].u)}
    lines.push("");
    jr.forEach(function(o){var ta=app.querySelector('#journal textarea[data-k="'+o[0]+'"]');lines.push(o[1]+":\n"+(ta?ta.value:"")+"\n")});
    var txt=lines.join("\n"),msg=document.getElementById("copied");
    function ok(){msg.textContent="Copied"}
    function fail(){msg.textContent="Could not copy. Select the text and copy it yourself."}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fail)}
      else{fail()}
    }catch(e){fail()}
  });
  update();
}

/* ---------- ROUTER ---------- */
function route(){
  var p=(location.hash||"#/").replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!p.length)home(); else brief(p[0]);
  window.scrollTo(0,0);
}
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-go]");
  if(el){location.hash=el.getAttribute("data-go")}
});
window.addEventListener("hashchange",route);
route();
})();
</script>
</body>
</html>
